      - generic [ref=f2e58]:
        - heading "About Us" [level=2] [ref=f2e59]
        - paragraph [ref=f2e60]: MINDCARTER is an organizational psychology consulting firm dedicated to building future-ready, high-performing workplaces by strengthening human systems. By combining evidence-based psychology with practical business insight, Mindcarter delivers tailored, ethically grounded interventions that enhance leadership, optimize talent decisions, and foster employee wellbeing. Crucially, as companies navigate rapid technological shifts, Mindcarter integrates behavioral AI governance to ensure organizations build AI-ready workforces that balance advanced technology with strong human oversight and responsible adoption.
        - link "Read more" [ref=f2e61] [cursor=pointer]:
          - /url: /about
